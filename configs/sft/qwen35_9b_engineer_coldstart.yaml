### model
model_name_or_path: Qwen/Qwen3.5-9B
trust_remote_code: true
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
### Point dataset_dir at a LLaMA-Factory dataset directory holding train.json
### and dataset_info.json, built with build_llamafactory_mixed_sft_dataset.py.
dataset_dir: /path/to/harness_r1_sft
dataset: harness_r1_sft
template: qwen3_5
enable_thinking: true
cutoff_len: 32768
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: outputs/qwen35_9b_harness_r1_coldstart_sft
logging_steps: 1
save_steps: 100000000
save_total_limit: 1
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null

### no held-out loss set was used during cold-start SFT
